name: Notify Push on Discord

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Send Discord Notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Push Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            jq -n \
              --arg repo "$REPO_NAME" \
              --arg branch "$BRANCH_NAME" \
              --arg author "$COMMIT_AUTHOR" \
              --arg msg "$COMMIT_MESSAGE" \
              --arg url "$COMMIT_URL" \
              --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{
                embeds: [{
                  title: "New commit on " + $repo,
                  url: $url,
                  description: "**Branch:** " + $branch + "\n**Author:** " + $author + "\n**Commit Message:**\n" + $msg,
                  color: 3447003,
                  timestamp: $time
                }]
              }' > discord_payload.json

            curl -s -H "Content-Type: application/json" -X POST -d @discord_payload.json "$DISCORD_WEBHOOK_URL" || true
          else
            echo "DISCORD_WEBHOOK_URL secret is not configured in repository settings."
          fi
